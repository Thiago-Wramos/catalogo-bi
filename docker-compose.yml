# Catálogo de Dados com IA
# MySQL (relacional) + Qdrant (vetorial) + aplicação (Streamlit)
# O Ollama NÃO está aqui: no protótipo ele roda nativo no Windows para usar a GPU direto.

name: catalogo-bi

services:

  mysql:
    image: mysql:8.4                      # versão LTS fixada (nunca "latest")
    container_name: catalogo-mysql
    restart: unless-stopped               # volta sozinho se o Docker reiniciar, salvo se você parar
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # valores vêm do arquivo .env
      MYSQL_DATABASE: ${MYSQL_DATABASE}             # banco criado na primeira subida
      MYSQL_USER: ${MYSQL_USER}                     # usuário da aplicação (não é root)
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3306:3306"             # só acessível pela sua máquina, não pela rede
    volumes:
      - mysql_data:/var/lib/mysql         # dados persistem fora do container
    mem_limit: 1g                         # teto de RAM (sua máquina tem ~16 GB)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION}    # versão fixada no .env
    container_name: catalogo-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}   # exige chave em toda requisição
    ports:
      - "127.0.0.1:6333:6333"             # API REST + dashboard web
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 1g

  app:
    build: .                              # imagem construída a partir do Dockerfile desta pasta
    container_name: catalogo-app
    restart: unless-stopped
    environment:
      # Só o que a aplicação precisa. A senha de ROOT do MySQL não entra aqui.
      MYSQL_HOST: mysql                   # nome do serviço, não "127.0.0.1"
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      QDRANT_URL: http://qdrant:6333      # nome do serviço, não "127.0.0.1"
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      OLLAMA_HOST: http://host.docker.internal:11434   # o Ollama que roda no Windows
      # Ajustes opcionais (se não estiverem no .env, valem os padrões)
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.5:9b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      SCORE_MINIMO: ${SCORE_MINIMO:-0.45}
      MARGEM_RELEVANCIA: ${MARGEM_RELEVANCIA:-0.05}
      LIMIAR_INTENCAO: ${LIMIAR_INTENCAO:-0.70}
      POLITICA_SEM_ACESSO: ${POLITICA_SEM_ACESSO:-indicar}
      TZ: America/Sao_Paulo
    extra_hosts:
      - "host.docker.internal:host-gateway"   # garante esse nome também num servidor Linux
    ports:
      - "127.0.0.1:8501:8501"             # a interface, só pela sua máquina
    depends_on:
      mysql:
        condition: service_healthy        # só sobe quando o MySQL estiver pronto
      qdrant:
        condition: service_started
    mem_limit: 1g

volumes:
  mysql_data:
  qdrant_data:
